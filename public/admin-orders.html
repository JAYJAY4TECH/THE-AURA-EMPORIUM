<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Manage Orders | THE AURA EMPORIUM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/fontawesome/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/animations.css"><style>:root{--gold:#d4af37;--gold-soft:#f8f1dd;--deep-gold:#9b7c1c;--ink:#1a1a1a;--paper:#f8f6f3;--ease-luxury:cubic-bezier(0.16, 1, 0.3, 1)}*{box-sizing:border-box;-webkit-font-smoothing:antialiased}body{font-family:Inter,sans-serif;background:var(--paper);margin:0;padding:20px;min-height:100vh;color:var(--ink);position:relative}body::before{content:'';position:fixed;inset:-15%;background-image:radial-gradient(rgba(212,175,55,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,rgba(0,0,0,1),transparent 96%);pointer-events:none;transform:rotate(4deg);opacity:.8}.container{max-width:1200px;margin:0 auto;background:#fff;border-radius:20px;padding:30px;box-shadow:0 5px 30px rgba(0,0,0,.05);border:1px solid rgba(212,175,55,.2);position:relative;overflow:hidden;animation:fadeInUp .8s var(--ease-luxury) both;transition:box-shadow .7s var(--ease-luxury),transform .7s var(--ease-luxury)}.container::before{content:'';position:absolute;left:-25%;top:-12%;width:30%;height:130%;transform:rotate(15deg);background:linear-gradient(90deg,transparent,rgba(212,175,55,.12),transparent);filter:blur(12px);opacity:0;transition:left .9s var(--ease-luxury),opacity .7s var(--ease-luxury)}.container:hover{box-shadow:0 14px 44px rgba(212,175,55,.12),0 0 40px rgba(212,175,55,.08);transform:translateY(-2px)}.container:hover::before{opacity:1;left:105%}h2{font-family:'Playfair Display',serif;color:var(--ink);margin-bottom:20px;opacity:0;transform:translateY(8px);animation:fadeInUp .6s var(--ease-luxury) .25s forwards;position:relative}h2 i{color:var(--gold);margin-right:10px;display:inline-block;animation:crownShimmer 2.8s var(--ease-luxury) infinite}h2 i::after{content:'';position:absolute;left:-10%;top:40%;width:0;height:1px;background:var(--gold);transition:width .5s var(--ease-luxury)}table{width:100%;border-collapse:collapse;margin-top:20px;opacity:0;animation:tableRise .75s var(--ease-luxury) .12s forwards}tbody tr{position:relative;animation:fadeInUpRow .38s var(--ease-luxury) forwards}tbody tr:first-child{animation-delay:30ms}tbody tr:nth-child(2){animation-delay:60ms}tbody tr:nth-child(3){animation-delay:90ms}tbody tr:nth-child(4){animation-delay:.12s}tbody tr:nth-child(5){animation-delay:.15s}tbody tr::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);transform-origin:left center;transform:scaleY(0);transition:transform .45s var(--ease-luxury),opacity .45s var(--ease-luxury);opacity:0}tbody tr:hover{background:rgba(212,175,55,.05)}tbody tr:hover::before{transform:scaleY(1);opacity:1}td,th{padding:14px;border-bottom:1px solid #f0f0f0;text-align:left;font-size:14px;transition:background .45s var(--ease-luxury),color .45s var(--ease-luxury),transform .45s var(--ease-luxury)}th{background:var(--paper);font-weight:700;color:var(--ink);border-bottom:1px solid rgba(212,175,55,.2)}tbody tr:hover td{color:var(--ink)}select{padding:8px;border-radius:8px;border:1px solid #ddd;font-size:14px;color:var(--ink);background:#fff;outline:0;transition:border-color .3s var(--ease-luxury),box-shadow .3s var(--ease-luxury),background .3s var(--ease-luxury),transform .3s var(--ease-luxury)}select:focus{border-color:var(--gold);box-shadow:0 0 0 .2rem rgba(212,175,55,.13),0 0 12px rgba(212,175,55,.28);background:var(--paper)}.btn-update{background:linear-gradient(135deg,var(--gold),#c5a030);color:var(--ink);padding:8px 15px;border:none;border-radius:50px;font-weight:600;cursor:pointer;font-size:13px;position:relative;overflow:hidden;transition:transform .4s var(--ease-luxury),box-shadow .4s var(--ease-luxury),color .4s var(--ease-luxury),background .4s var(--ease-luxury);isolation:isolate}.btn-update::before{content:'';position:absolute;top:-30%;left:-150%;width:50%;height:160%;transform:skewX(-30deg);background:linear-gradient(120deg,transparent,rgba(255,255,255,.85),transparent);transition:left .84s var(--ease-luxury),opacity .4s var(--ease-luxury);opacity:.95;z-index:-1}.btn-update:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(212,175,55,.28),0 0 16px rgba(212,175,55,.4);color:var(--ink)}.btn-update:hover::before{left:125%}.badge{display:inline-block;padding:6px 12px;border-radius:50px;font-size:12px;font-weight:600;animation:badgePulse 2.4s var(--ease-luxury) infinite;transition:transform .4s var(--ease-luxury),box-shadow .4s var(--ease-luxury),background .4s var(--ease-luxury)}.badge:hover{transform:scale(1.05);box-shadow:0 0 14px rgba(212,175,55,.25)}.badge-pending{background:#fff3cd;color:#856404}.badge-confirmed{background:#d1ecf1;color:#0c5460}.badge-shipped{background:#d4edda;color:#155724}.badge-delivered{background:#cce5ff;color:#004085}@keyframes fadeInUp{from{opacity:0;filter:blur(8px);transform:translateY(20px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}@keyframes crownShimmer{50%{filter:drop-shadow(0 0 8px rgba(212,175,55,.8));transform:scale(1.04);color:var(--deep-gold)}}@keyframes tableRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeInUpRow{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes badgePulse{50%{box-shadow:0 0 0 4px rgba(212,175,55,.08),0 0 16px rgba(212,175,55,.25)}}@media (max-width:768px){body{padding:16px}.container{padding:20px 14px;max-width:100%;border-radius:14px;overflow-x:auto}table{min-width:680px;width:max-content}.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}}@media (prefers-reduced-motion:reduce){*,::after,::before{animation-duration:0s!important;animation-iteration-count:1!important;transition-duration:0s!important;scroll-behavior:auto!important}}</style><link rel="stylesheet" href="/responsive.css"><link rel="stylesheet" href="/toast.css"></head><body><div class="container"><h2><i class="fas fa-shopping-bag"></i>Manage Orders</h2><table><thead><tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody id="ordersTable"></tbody></table></div><script>async function loadOrders(){try{const t=await fetch("/api/admin/orders"),e=await t.json();document.getElementById("ordersTable").innerHTML=e.map(t=>`\n                <tr>\n                    <td><strong>${t.orderNumber}</strong></td>\n                    <td>${t.customerName}<br><small style="color:#888;">${t.customerEmail}</small></td>\n                    <td>₦${t.total.toLocaleString()}</td>\n                    <td><span class="badge badge-${t.orderStatus.toLowerCase()}">${t.orderStatus}</span></td>\n                    <td>${new Date(t.createdAt).toLocaleDateString()}</td>\n                    <td>\n                        <select id="status-${t._id}">\n                            <option value="Pending" ${"Pending"===t.orderStatus?"selected":""}>Pending</option>\n                            <option value="Confirmed" ${"Confirmed"===t.orderStatus?"selected":""}>Confirmed</option>\n                            <option value="Shipped" ${"Shipped"===t.orderStatus?"selected":""}>Shipped</option>\n                            <option value="Delivered" ${"Delivered"===t.orderStatus?"selected":""}>Delivered</option>\n                        </select>\n                        <button class="btn-update" onclick="updateOrderStatus('${t._id}')">Update</button>\n                    </td>\n                </tr>\n            `).join("")}catch(t){console.error("Error loading orders:",t)}}async function updateOrderStatus(t){const e=document.getElementById(`status-${t}`).value;try{const o=await fetch(`/api/admin/orders/${t}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:e})});(await o.json()).success?(showToast("Order status updated to "+e+".","success"),loadOrders()):showToast("Error updating order.","error")}catch(t){showToast("Network error. Please try again.","error")}}window.onload=loadOrders</script><script src="/toast.js"></script></body></html>
