<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Orders | THE AURA EMPORIUM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/fontawesome/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/animations.css">
    <style>
        :root {
            --gold: #d4af37;
            --gold-soft: #f8f1dd;
            --deep-gold: #9b7c1c;
            --ink: #1a1a1a;
            --paper: #f8f6f3;
            --ease-luxury: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--paper);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: var(--ink);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: -15%;
            background-image: radial-gradient(rgba(212,175,55,0.035) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: linear-gradient(180deg, rgba(0,0,0,1), transparent 96%);
            pointer-events: none;
            transform: rotate(4deg);
            opacity: 0.8;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(212,175,55,0.2);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s var(--ease-luxury) both;
            transition: box-shadow 0.7s var(--ease-luxury), transform 0.7s var(--ease-luxury);
        }

        .container::before {
            content: '';
            position: absolute;
            left: -25%;
            top: -12%;
            width: 30%;
            height: 130%;
            transform: rotate(15deg);
            background: linear-gradient(90deg, transparent, rgba(212,175,55,0.12), transparent);
            filter: blur(12px);
            opacity: 0;
            transition: left 0.9s var(--ease-luxury), opacity 0.7s var(--ease-luxury);
        }

        .container:hover {
            box-shadow: 0 14px 44px rgba(212,175,55,0.12), 0 0 40px rgba(212,175,55,0.08);
            transform: translateY(-2px);
        }

        .container:hover::before {
            opacity: 1;
            left: 105%;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: var(--ink);
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(8px);
            animation: fadeInUp 0.6s var(--ease-luxury) 0.25s forwards;
            position: relative;
        }

        h2 i {
            color: var(--gold);
            margin-right: 10px;
            display: inline-block;
            animation: crownShimmer 2.8s var(--ease-luxury) infinite;
        }

        h2 i::after {
            content: '';
            position: absolute;
            left: -10%;
            top: 40%;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.5s var(--ease-luxury);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            opacity: 0;
            animation: tableRise 0.75s var(--ease-luxury) 0.12s forwards;
        }

        tbody tr {
            position: relative;
            animation: fadeInUpRow 0.38s var(--ease-luxury) forwards;
        }

        tbody tr:nth-child(1) { animation-delay: 0.03s; }
        tbody tr:nth-child(2) { animation-delay: 0.06s; }
        tbody tr:nth-child(3) { animation-delay: 0.09s; }
        tbody tr:nth-child(4) { animation-delay: 0.12s; }
        tbody tr:nth-child(5) { animation-delay: 0.15s; }

        tbody tr::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--gold);
            transform-origin: left center;
            transform: scaleY(0);
            transition: transform 0.45s var(--ease-luxury), opacity 0.45s var(--ease-luxury);
            opacity: 0;
        }

        tbody tr:hover {
            background: rgba(212,175,55,0.05);
        }

        tbody tr:hover::before {
            transform: scaleY(1);
            opacity: 1;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #f0f0f0;
            text-align: left;
            font-size: 14px;
            transition: background 0.45s var(--ease-luxury), color 0.45s var(--ease-luxury), transform 0.45s var(--ease-luxury);
        }

        th {
            background: var(--paper);
            font-weight: 700;
            color: var(--ink);
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }

        tbody tr:hover td {
            color: var(--ink);
        }
        
        select {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            color: var(--ink);
            background: #fff;
            outline: none;
            transition: border-color 0.3s var(--ease-luxury), box-shadow 0.3s var(--ease-luxury), background 0.3s var(--ease-luxury), transform 0.3s var(--ease-luxury);
        }

        select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 0.2rem rgba(212,175,55,0.13), 0 0 12px rgba(212,175,55,0.28);
            background: var(--paper);
        }

        .btn-update {
            background: linear-gradient(135deg, var(--gold), #c5a030);
            color: var(--ink);
            padding: 8px 15px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            position: relative;
            overflow: hidden;
            transition: transform 0.4s var(--ease-luxury), box-shadow 0.4s var(--ease-luxury), color 0.4s var(--ease-luxury), background 0.4s var(--ease-luxury);
            isolation: isolate;
        }

        .btn-update::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -150%;
            width: 50%;
            height: 160%;
            transform: skewX(-30deg);
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.85), transparent);
            transition: left 0.84s var(--ease-luxury), opacity 0.4s var(--ease-luxury);
            opacity: 0.95;
            z-index: -1;
        }

        .btn-update:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212,175,55,0.28), 0 0 16px rgba(212,175,55,0.4);
            color: var(--ink);
        }

        .btn-update:hover::before {
            left: 125%;
        }
        
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            animation: badgePulse 2.4s var(--ease-luxury) infinite;
            transition: transform 0.4s var(--ease-luxury), box-shadow 0.4s var(--ease-luxury), background 0.4s var(--ease-luxury);
        }

        .badge:hover {
            transform: scale(1.05);
            box-shadow: 0 0 14px rgba(212,175,55,0.25);
        }

        .badge-pending {
            background: #fff3cd;
            color: #856404;
        }

        .badge-confirmed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .badge-shipped {
            background: #d4edda;
            color: #155724;
        }

        .badge-delivered {
            background: #cce5ff;
            color: #004085;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                filter: blur(8px);
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }

        @keyframes crownShimmer {
            50% {
                filter: drop-shadow(0 0 8px rgba(212,175,55,0.8));
                transform: scale(1.04);
                color: var(--deep-gold);
            }
        }

        @keyframes tableRise {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUpRow {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes badgePulse {
            50% {
                box-shadow: 0 0 0 4px rgba(212,175,55,0.08), 0 0 16px rgba(212,175,55,0.25);
            }
        }

        .btn-danger-sm {
            background: #fff;
            color: #b42318;
            padding: 8px 14px;
            border: 1px solid #f0c6c2;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: transform 0.3s var(--ease-luxury), box-shadow 0.3s var(--ease-luxury);
        }

        .btn-danger-sm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(180, 35, 24, 0.18);
        }

        .danger-zone {
            margin-top: 28px;
            border: 1px solid #f0c6c2;
            background: #fff7f6;
            border-radius: 14px;
            padding: 20px;
        }

        .danger-zone h3 {
            font-family: 'Playfair Display', serif;
            color: #7a271a;
            margin: 0 0 6px;
            font-size: 19px;
        }

        .danger-zone p {
            color: #7a271a;
            font-size: 13px;
            margin: 0 0 14px;
        }

        .danger-zone .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-danger-solid {
            background: #b42318;
            color: #fff;
            padding: 10px 18px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-danger-solid:hover { background: #912018; }

        .btn-warn-solid {
            background: #b54708;
            color: #fff;
            padding: 10px 18px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-warn-solid:hover { background: #93370d; }

        .btn-dark-solid {
            background: #1a1a1a;
            color: #f5e6a3;
            padding: 10px 18px;
            border: 1px solid rgba(212,175,55,0.5);
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        .aura-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(13, 13, 13, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            padding: 16px;
        }

        .aura-modal-backdrop.open { display: flex; }

        .aura-modal {
            background: #fff;
            border-radius: 16px;
            max-width: 440px;
            width: 100%;
            padding: 26px;
            border: 1px solid rgba(212,175,55,0.35);
            box-shadow: 0 24px 70px rgba(0,0,0,0.35);
        }

        .aura-modal h4 {
            font-family: 'Playfair Display', serif;
            margin: 0 0 8px;
            color: #7a271a;
        }

        .aura-modal p { color: #444; font-size: 14px; margin: 0 0 6px; }

        .aura-modal .modal-detail {
            background: #faf8f5;
            border: 1px solid #efeae2;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            margin: 10px 0 18px;
            word-break: break-word;
        }

        .aura-modal .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-cancel-modal {
            background: #f1efeB;
            border: 1px solid #ddd;
            border-radius: 50px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-confirm-modal {
            background: #b42318;
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 10px 18px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-confirm-modal:disabled { opacity: 0.6; cursor: not-allowed; }

        .admin-log-list {
            margin-top: 18px;
            font-size: 13px;
        }

        .admin-log-list .log-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #f0e8d2;
        }

        .admin-log-list .log-action { font-weight: 700; color: #7a271a; }
        .admin-log-list .log-time { color: #888; white-space: nowrap; }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .container {
                padding: 20px 14px;
                max-width: 100%;
                border-radius: 14px;
                overflow-x: auto;
            }

            table {
                min-width: 680px;
                width: max-content;
            }

            .table-wrap {
                width: 100%;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                border-radius: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
    <link rel="stylesheet" href="/responsive.css">
    <link rel="stylesheet" href="/toast.css">
</head>
<body>

<div class="container">
    <h2><i class="fas fa-shopping-bag"></i>Manage Orders</h2>
    
    <table>
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Total</th>
                <th>Status</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
    </table>

    <div class="danger-zone" id="dangerZone">
        <h3><i class="fas fa-triangle-exclamation"></i> Danger Zone — Admin Only</h3>
        <p>Back up your database first. Every action below is permanent and is written to the admin log.</p>
        <div class="btn-row">
            <button class="btn-danger-solid" id="btnClearOrders" type="button"><i class="fas fa-trash"></i> Clear All Orders</button>
            <button class="btn-warn-solid" id="btnResetRevenue" type="button"><i class="fas fa-rotate-left"></i> Reset Revenue / Stats to Zero</button>
            <button class="btn-warn-solid" id="btnClearTrackHistory" type="button"><i class="fas fa-clock-rotate-left"></i> Clear Track-Order History</button>
            <button class="btn-dark-solid" id="btnMasterReset" type="button"><i class="fas fa-bomb"></i> Reset Site Data (Master)</button>
        </div>
        <div class="admin-log-list" id="adminLogList"></div>
    </div>
</div>

<div class="aura-modal-backdrop" id="confirmBackdrop" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="aura-modal">
        <h4 id="confirmTitle">Are you sure?</h4>
        <p id="confirmText">This action is permanent.</p>
        <div class="modal-detail" id="confirmDetail"></div>
        <div class="modal-actions">
            <button class="btn-cancel-modal" id="confirmCancel" type="button">Cancel</button>
            <button class="btn-confirm-modal" id="confirmOk" type="button">Yes, Continue</button>
        </div>
    </div>
</div>

<script>
    const TRACK_HISTORY_KEYS = ['aura_track_history', 'aura_trackHistory', 'trackHistory', 'track_history', 'lastTrackedOrder'];

    function clearLocalTrackHistory() {
        let cleared = 0;
        TRACK_HISTORY_KEYS.forEach((key) => {
            try {
                if (localStorage.getItem(key) !== null) { localStorage.removeItem(key); cleared++; }
                if (sessionStorage.getItem(key) !== null) { sessionStorage.removeItem(key); cleared++; }
            } catch (e) { /* storage unavailable — ignore */ }
        });
        return cleared;
    }

    function broadcastTrackHistoryClear() {
        try {
            localStorage.setItem('aura:reset-site-data', String(Date.now()));
            localStorage.removeItem('aura:reset-site-data');
        } catch (e) { /* storage unavailable — ignore */ }
    }

    let pendingConfirm = null;

    function openConfirm(opts) {
        pendingConfirm = { action: opts.action };
        document.getElementById('confirmTitle').textContent = opts.title;
        document.getElementById('confirmText').textContent = opts.text;
        document.getElementById('confirmDetail').textContent = opts.detail || '';
        const ok = document.getElementById('confirmOk');
        ok.textContent = opts.okLabel || 'Yes, Continue';
        ok.disabled = false;
        document.getElementById('confirmBackdrop').classList.add('open');
    }

    function closeConfirm() {
        pendingConfirm = null;
        document.getElementById('confirmBackdrop').classList.remove('open');
    }

    async function handleApiResponse(res) {
        if (res.status === 401) {
            showToast('Admin session expired. Please log in again.', 'error');
            setTimeout(() => { window.location.href = '/admin/login'; }, 1500);
            return null;
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.success === false) {
            throw new Error(data.error || ('Request failed (' + res.status + ')'));
        }
        return data;
    }

    async function loadOrders() {
        try {
            const res = await fetch('/api/admin/orders');
            const orders = await res.json();
            
            const tbody = document.getElementById('ordersTable');
            tbody.innerHTML = orders.map(order => `
                <tr>
                    <td><strong>${order.orderNumber}</strong></td>
                    <td>${order.customerName}<br><small style="color:#888;">${order.customerEmail}</small></td>
                    <td>₦${order.total.toLocaleString()}</td>
                    <td><span class="badge badge-${order.orderStatus.toLowerCase()}">${order.orderStatus}</span></td>
                    <td>${new Date(order.createdAt).toLocaleDateString()}</td>
                    <td>
                        <select id="status-${order._id}">
                            <option value="Pending" ${order.orderStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Confirmed" ${order.orderStatus === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="Shipped" ${order.orderStatus === 'Shipped' ? 'selected' : ''}>Shipped</option>
                            <option value="Delivered" ${order.orderStatus === 'Delivered' ? 'selected' : ''}>Delivered</option>
                        </select>
                        <button class="btn-update" onclick="updateOrderStatus('${order._id}')">Update</button>
                        <button class="btn-danger-sm" onclick="deleteSingleOrder('${order._id}', '${order.orderNumber}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        } catch (error) {
            console.error('Error loading orders:', error);
        }
    }

    async function updateOrderStatus(orderId) {
        const status = document.getElementById(`status-${orderId}`).value;
        
        try {
            const res = await fetch(`/api/admin/orders/${orderId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: status })
            });
            const data = await res.json();
            
            if (data.success) {
                showToast('Order status updated to ' + status + '.', 'success');
                loadOrders();
            } else {
                showToast('Error updating order.', 'error');
            }
        } catch (error) {
            showToast('Network error. Please try again.', 'error');
        }
    }

    window.onload = function() {
        loadOrders();
        loadAdminLogs();
    };

    document.getElementById('confirmCancel').addEventListener('click', closeConfirm);
    document.getElementById('confirmBackdrop').addEventListener('click', (e) => {
        if (e.target.id === 'confirmBackdrop') closeConfirm();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeConfirm();
    });
    document.getElementById('confirmOk').addEventListener('click', async () => {
        if (!pendingConfirm) return;
        const action = pendingConfirm.action;
        document.getElementById('confirmOk').disabled = true;
        try { await action(); } finally { closeConfirm(); }
    });

    async function deleteSingleOrder(orderId, orderNumber) {
        openConfirm({
            title: 'Delete this order?',
            text: 'This permanently deletes one order. This cannot be undone.',
            detail: 'Order: ' + orderNumber,
            okLabel: 'Yes, Delete Order',
            action: async () => {
                try {
                    const data = await handleApiResponse(await fetch('/api/admin/orders/' + orderId, { method: 'DELETE' }));
                    if (!data) return;
                    showToast('Order ' + data.orderNumber + ' deleted.', 'success');
                    loadOrders();
                    loadAdminLogs();
                } catch (error) {
                    showToast('Delete failed: ' + error.message, 'error');
                }
            }
        });
    }

    document.getElementById('btnClearOrders').addEventListener('click', () => {
        openConfirm({
            title: 'Clear ALL orders?',
            text: 'This permanently deletes every order (revenue and stats go to zero). Back up your database first.',
            detail: 'Includes paid, pending, shipped and delivered orders.',
            okLabel: 'Yes, Clear All Orders',
            action: async () => {
                try {
                    const data = await handleApiResponse(await fetch('/api/admin/orders', { method: 'DELETE' }));
                    if (!data) return;
                    showToast('Cleared ' + data.deletedCount + ' order(s).', 'success');
                    loadOrders();
                    loadAdminLogs();
                } catch (error) {
                    showToast('Clear failed: ' + error.message, 'error');
                }
            }
        });
    });

    document.getElementById('btnResetRevenue').addEventListener('click', () => {
        openConfirm({
            title: 'Reset revenue / stats to zero?',
            text: 'Revenue and stats are computed from orders, so this deletes all orders. Products and reviews are kept.',
            detail: 'Result: total orders = 0, revenue = 0, pending = 0.',
            okLabel: 'Yes, Reset Revenue',
            action: async () => {
                try {
                    const data = await handleApiResponse(await fetch('/api/admin/reset-revenue', { method: 'POST' }));
                    if (!data) return;
                    showToast('Revenue reset. ' + data.deletedCount + ' order(s) removed.', 'success');
                    loadOrders();
                    loadAdminLogs();
                } catch (error) {
                    showToast('Reset failed: ' + error.message, 'error');
                }
            }
        });
    });

    document.getElementById('btnClearTrackHistory').addEventListener('click', () => {
        openConfirm({
            title: 'Clear track-order history?',
            text: 'Clears saved tracking lookups stored in this browser so the track form opens empty.',
            detail: 'Keys cleared: ' + TRACK_HISTORY_KEYS.join(', '),
            okLabel: 'Yes, Clear History',
            action: async () => {
                const cleared = clearLocalTrackHistory();
                broadcastTrackHistoryClear();
                showToast(cleared > 0 ? 'Track-order history cleared.' : 'No saved track history found.', 'success');
            }
        });
    });

    document.getElementById('btnMasterReset').addEventListener('click', () => {
        openConfirm({
            title: 'MASTER RESET — delete everything order-related?',
            text: 'Deletes ALL orders (revenue, stats and tracking go to zero) and clears this browser history. Products and reviews are kept. Back up first.',
            detail: 'One click = permanent delete.',
            okLabel: 'Yes, Reset Site Data',
            action: async () => {
                try {
                    const data = await handleApiResponse(await fetch('/api/admin/reset-site-data', { method: 'POST' }));
                    if (!data) return;
                    clearLocalTrackHistory();
                    broadcastTrackHistoryClear();
                    showToast('Site data reset. ' + data.deletedCount + ' order(s) removed.', 'success');
                    loadOrders();
                    loadAdminLogs();
                } catch (error) {
                    showToast('Master reset failed: ' + error.message, 'error');
                }
            }
        });
    });

    async function loadAdminLogs() {
        try {
            const res = await fetch('/api/admin/logs');
            if (res.status === 401) return;
            const data = await res.json();
            const list = document.getElementById('adminLogList');
            if (!data.success || !data.logs || data.logs.length === 0) {
                list.innerHTML = '<p style="color:#888; margin: 12px 0 0;">No reset actions logged yet.</p>';
                return;
            }
            list.innerHTML = '<h6 style="margin:14px 0 4px; font-size:13px; color:#7a271a;">Recent reset log</h6>' + data.logs.slice(0, 10).map((log) => {
                const when = log.createdAt ? new Date(log.createdAt).toLocaleString() : '';
                const safeDetail = String(log.detail || log.action || '').replace(/</g, '&lt;');
                return '<div class="log-row"><span class="log-action">' + log.action + '</span><span>' + safeDetail + '</span><span class="log-time">' + when + '</span></div>';
            }).join('');
        } catch (error) { /* log panel is best-effort */ }
    }
    </script>
    <script src="/toast.js"></script>
</body>
</html>
