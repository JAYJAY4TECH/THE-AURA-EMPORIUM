<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login - THE AURA EMPORIUM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/fontawesome/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/animations.css"><style>:root{--luxury-gold:#d4af37;--luxury-gold-soft:#f6e8b8;--luxury-gold-deep:#876c19;--luxury-dark:#0d0d0d;--luxury-ink:#1a1a1a;--ease-luxury:cubic-bezier(0.16, 1, 0.3, 1)}*{box-sizing:border-box;-webkit-font-smoothing:antialiased}body{font-family:Inter,sans-serif;background:radial-gradient(circle at 50% 45%,rgba(212,175,55,.08),transparent 20%),linear-gradient(135deg,#0d0d0d 0,#1a1a1a 50%,#2d2d2d 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;color:var(--luxury-ink);overflow-x:hidden;position:relative}body::before{content:'';position:fixed;width:min(560px,48vw);height:min(560px,48vw);left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.36),rgba(212,175,55,.12) 42%,transparent 75%);filter:blur(50px);opacity:.78;pointer-events:none;animation:pulseGlow 4s var(--ease-luxury) infinite}body::after{content:'';position:fixed;inset:-20%;background-image:radial-gradient(rgba(212,175,55,.06) 1px,transparent 1px);background-size:54px 54px;transform:rotate(7deg);mask-image:linear-gradient(180deg,rgba(0,0,0,1),transparent 100%);pointer-events:none;opacity:.65}.auth-card{position:relative;background:#fff;border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3),0 0 0 1px rgba(212,175,55,.25),0 0 24px rgba(212,175,55,.12);animation:fadeInUp .9s var(--ease-luxury) both;overflow:hidden;transition:transform .6s var(--ease-luxury),box-shadow .6s var(--ease-luxury),border-color .6s var(--ease-luxury);border:1px solid rgba(212,175,55,.4)}.auth-card::before{content:'';position:absolute;inset:-2px;border-radius:20px;padding:1px;background:linear-gradient(135deg,transparent,var(--luxury-gold),transparent,var(--luxury-gold-soft));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;opacity:0;transform:scale(1.01);transition:opacity .7s var(--ease-luxury);pointer-events:none}.auth-card::after{content:'';position:absolute;width:130%;height:1px;left:-15%;top:42%;background:linear-gradient(90deg,transparent,rgba(212,175,55,.8),transparent);transform:rotate(-8deg);opacity:0;transition:opacity .7s var(--ease-luxury);pointer-events:none}.auth-card:hover{transform:translateY(-4px);box-shadow:0 26px 80px rgba(212,175,55,.22),0 0 50px rgba(212,175,55,.18)}.auth-card:hover::before{opacity:1;animation:ringShimmer 2.2s var(--ease-luxury) infinite}.auth-card:hover::after{opacity:1}.auth-card .brand{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--luxury-ink);text-align:center;margin-bottom:30px;position:relative;background-image:linear-gradient(90deg,var(--luxury-ink),var(--luxury-gold),var(--luxury-gold-soft),var(--luxury-ink));background-size:260% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:brandShimmer 1.8s var(--ease-luxury) .15s both}.auth-card .brand i{color:var(--luxury-gold);margin-right:10px;filter:drop-shadow(0 0 10px rgba(212,175,55,.8));animation:crownShimmer 2.5s var(--ease-luxury) infinite}.auth-card label{font-weight:600;margin-bottom:5px;color:var(--luxury-ink);display:block;transition:color .4s var(--ease-luxury);animation:fadeInUp .45s var(--ease-luxury) both}.auth-card input{border:1px solid #ddd;border-radius:10px;padding:12px 15px;width:100%;margin-bottom:15px;background:#faf8f5;color:var(--luxury-ink);transition:border-color .3s var(--ease-luxury),box-shadow .3s var(--ease-luxury),background .3s var(--ease-luxury),transform .3s var(--ease-luxury),filter .3s var(--ease-luxury);animation:fadeInUp .45s var(--ease-luxury) both}.auth-card input:focus{border-color:var(--luxury-gold);outline:0;box-shadow:0 0 0 .25rem rgba(212,175,55,.14),0 0 15px rgba(212,175,55,.25);background:#fff;transition:border-color .3s var(--ease-luxury),box-shadow .3s var(--ease-luxury),background .3s var(--ease-luxury),transform .3s var(--ease-luxury)}.auth-card h4{font-family:'Playfair Display',serif;color:var(--luxury-ink);font-weight:700;letter-spacing:.02em;text-align:center;margin-bottom:24px;position:relative}.auth-card h4::after{content:'';display:block;width:50px;height:2px;background:var(--luxury-gold);margin:12px auto 0;opacity:.9}.btn-gold{background:linear-gradient(135deg,var(--luxury-gold) 0,#c5a030 100%);color:var(--luxury-ink);padding:14px 40px;border:none;border-radius:50px;font-weight:700;font-size:16px;width:100%;cursor:pointer;position:relative;overflow:hidden;transition:transform .4s var(--ease-luxury),box-shadow .4s var(--ease-luxury),color .4s var(--ease-luxury),background .4s var(--ease-luxury);isolation:isolate}.btn-dark::before,.btn-gold::before{content:'';position:absolute;top:-20%;left:-130%;width:50%;height:140%;transform:skewX(-30deg);background:linear-gradient(120deg,transparent,rgba(255,255,255,.85),transparent);transition:left .84s var(--ease-luxury),opacity .4s var(--ease-luxury);opacity:.86;z-index:-1}.btn-gold:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(212,175,55,.32),0 0 24px rgba(212,175,55,.38);color:var(--luxury-ink)}.btn-gold:hover::before{left:125%}.btn-dark{background:var(--luxury-ink);color:#fff;padding:14px 40px;border:none;border-radius:50px;font-weight:600;font-size:16px;width:100%;cursor:pointer;position:relative;overflow:hidden;transition:all .4s var(--ease-luxury);margin-top:10px}.btn-dark:hover{background:var(--luxury-gold);color:var(--luxury-ink);transform:translateY(-3px);box-shadow:0 10px 40px rgba(212,175,55,.25),0 0 16px rgba(212,175,55,.35)}.btn-dark:hover::before{left:125%}.form-box{display:none;opacity:0;transform:translateY(20px);animation:fadeInUp .5s var(--ease-luxury) both}.form-box.active{display:block;opacity:1;transform:translateY(0);animation:fadeInUp .5s var(--ease-luxury) both}.error-msg{color:#b84a4a;text-align:center;margin-top:10px;display:none;font-size:14px;font-weight:600;background:rgba(184,74,74,.06);border-radius:10px;padding:8px 12px;animation:errorShake .45s var(--ease-luxury) both}.success-msg{color:#2e7d50;text-align:center;margin-top:10px;display:none;font-size:14px;font-weight:600;background:rgba(46,125,80,.06);border-radius:10px;padding:8px 12px;animation:successSlide .48s var(--ease-luxury) both}.back-link{text-align:center;margin-top:15px}.back-link a{color:#888;text-decoration:none;font-size:14px;transition:color .3s var(--ease-luxury),padding-left .3s var(--ease-luxury)}.back-link a:hover{color:var(--luxury-gold);padding-left:4px}.form-box.active .btn-gold,.form-box.active input,.form-box.active label{animation-delay:var(--delay, 0s)}#loginBox .form-box{--delay:0s}@keyframes fadeInUp{from{opacity:0;filter:blur(8px);transform:translateY(20px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}@keyframes pulseGlow{50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}100%{opacity:.78;transform:translate(-50%,-50%) scale(1)}}@keyframes brandShimmer{0%{background-position:100% 0;filter:blur(8px);opacity:0}70%{opacity:1;filter:blur(0)}100%{background-position:0 0;filter:blur(0);opacity:1}}@keyframes ringShimmer{50%{transform:scale(1.015) rotate(10deg)}100%{transform:scale(1.02) rotate(360deg)}}@keyframes crownShimmer{50%{transform:scale(1.05);color:var(--luxury-gold-soft);filter:drop-shadow(0 0 15px rgba(212,175,55,.9))}}@keyframes errorShake{20%,80%{transform:translateX(3px)}40%{transform:translateX(-3px)}60%{transform:translateX(2px)}}@keyframes successSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media (max-width:768px){body{min-height:100vh;padding:30px 14px;align-items:center;justify-content:center}.auth-card{padding:28px 24px;max-width:min(420px,calc(100vw - 28px))}.auth-card .brand{font-size:24px}}@media (prefers-reduced-motion:reduce){*,::after,::before{animation-duration:0s!important;animation-iteration-count:1!important;transition-duration:0s!important;scroll-behavior:auto!important}}</style><link rel="stylesheet" href="/responsive.css"></head><body><div class="auth-card"><div class="brand"><i class="fas fa-crown"></i>THE AURA EMPORIUM</div><div class="form-box active" id="loginBox"><h4 class="text-center mb-4">Admin Login</h4><form id="loginForm"><label>Email Address</label> <input type="email" id="email" autocomplete="username" required> <label>Password</label> <input type="password" id="password" autocomplete="current-password" required> <button type="submit" class="btn-gold mt-3"><i class="fas fa-lock me-2"></i>Login</button><div class="error-msg" id="loginError"><i class="fas fa-exclamation-circle me-2"></i>Invalid credentials</div></form><div class="back-link"><a href="#" onclick="showForgotPassword()"><i class="fas fa-key me-2"></i>Forgot Password?</a></div></div><div class="form-box" id="forgotBox"><h4 class="text-center mb-4">Forgot Password</h4><form id="forgotForm"><label>Email Address</label> <input type="email" id="forgotEmail" placeholder="Enter your email" required> <button type="submit" class="btn-gold mt-3"><i class="fas fa-paper-plane me-2"></i>Send Reset Code</button><div class="success-msg" id="forgotSuccess"></div><div class="error-msg" id="forgotError"></div></form><div class="back-link"><a href="#" onclick="showLogin()"><i class="fas fa-arrow-left me-2"></i>Back to Login</a></div></div><div class="form-box" id="verifyBox"><h4 class="text-center mb-4">Enter Reset Code</h4><form id="verifyForm"><label>6-Digit Code</label> <input type="text" id="verifyCode" placeholder="Enter code sent to email" maxlength="6" required> <button type="submit" class="btn-gold mt-3"><i class="fas fa-check-circle me-2"></i>Verify Code</button><div class="error-msg" id="verifyError"></div></form><div class="back-link"><a href="#" onclick="showForgotPassword()"><i class="fas fa-arrow-left me-2"></i>Back</a></div></div><div class="form-box" id="resetBox"><h4 class="text-center mb-4">Reset Password</h4><form id="resetForm"><label>New Password</label> <input type="password" id="newPassword" placeholder="Enter new password" required> <label>Confirm New Password</label> <input type="password" id="confirmPassword" placeholder="Confirm new password" required> <button type="submit" class="btn-gold mt-3"><i class="fas fa-save me-2"></i>Reset Password</button><div class="error-msg" id="resetError"></div><div class="success-msg" id="resetSuccess"></div></form><div class="back-link"><a href="#" onclick="showLogin()"><i class="fas fa-arrow-left me-2"></i>Back to Login</a></div></div></div><script>function showLogin(){document.querySelectorAll(".form-box").forEach(e=>e.classList.remove("active")),document.getElementById("loginBox").classList.add("active")}function showForgotPassword(){document.querySelectorAll(".form-box").forEach(e=>e.classList.remove("active")),document.getElementById("forgotBox").classList.add("active")}function showVerifyCode(){document.querySelectorAll(".form-box").forEach(e=>e.classList.remove("active")),document.getElementById("verifyBox").classList.add("active")}function showResetPassword(){document.querySelectorAll(".form-box").forEach(e=>e.classList.remove("active")),document.getElementById("resetBox").classList.add("active")}document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const t=document.getElementById("email").value,o=document.getElementById("password").value,n=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:t,password:o})});(await n.json()).success?window.location.href="/admin/dashboard":document.getElementById("loginError").style.display="block"}),document.getElementById("forgotForm").addEventListener("submit",async e=>{e.preventDefault();const t=document.getElementById("forgotEmail").value,o=await fetch("/api/admin/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:t})}),n=await o.json();n.success?(document.getElementById("forgotSuccess").style.display="block",document.getElementById("forgotSuccess").textContent=n.message,setTimeout(showVerifyCode,1500)):(document.getElementById("forgotError").style.display="block",document.getElementById("forgotError").textContent=n.error)}),document.getElementById("verifyForm").addEventListener("submit",async e=>{e.preventDefault();const t=document.getElementById("forgotEmail").value,o=document.getElementById("verifyCode").value,n=await fetch("/api/admin/verify-code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:t,code:o})}),s=await n.json();s.success?showResetPassword():(document.getElementById("verifyError").style.display="block",document.getElementById("verifyError").textContent=s.error)}),document.getElementById("resetForm").addEventListener("submit",async e=>{e.preventDefault();const t=document.getElementById("forgotEmail").value,o=document.getElementById("verifyCode").value,n=document.getElementById("newPassword").value;if(n!==document.getElementById("confirmPassword").value)return document.getElementById("resetError").style.display="block",void(document.getElementById("resetError").textContent="Passwords do not match");const s=await fetch("/api/admin/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:t,code:o,newPassword:n})}),d=await s.json();d.success?(document.getElementById("resetSuccess").style.display="block",document.getElementById("resetSuccess").textContent=d.message,setTimeout(showLogin,2e3)):(document.getElementById("resetError").style.display="block",document.getElementById("resetError").textContent=d.error)})</script></body></html>
