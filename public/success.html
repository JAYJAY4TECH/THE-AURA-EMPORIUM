<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful - THE AURA EMPORIUM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-soft: #efe0b2;
            --deep: #0e0e0e;
            --paper: #faf8f5;
            --ink: #1a1a1a;
            --green: #28a745;
            --ease-luxury: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body {
            background: var(--paper);
            font-family: 'Inter', sans-serif;
            text-align: center;
            padding: 100px 20px;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.12), transparent 70%);
            transform: translate(-50%, -50%);
            filter: blur(16px);
            pointer-events: none;
            animation: pulseGlow 4s var(--ease-luxury) infinite;
        }

        .success-wrap {
            max-width: 780px;
            width: min(780px, calc(100vw - 40px));
            position: relative;
            z-index: 1;
        }

        .success-icon {
            font-size: 80px;
            color: var(--green);
            margin-bottom: 20px;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.68);
            box-shadow: 0 0 0 1px rgba(40,167,69,0.10), 0 0 18px rgba(40,167,69,0.30);
            animation: successPop 0.9s var(--ease-bounce) both;
        }

        .success-icon::before {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 1px solid rgba(40,167,69,0.25);
            animation: greenPulse 2.6s var(--ease-luxury) infinite;
        }

        .success-icon i {
            position: relative;
            z-index: 2;
            animation: iconFloat 2.8s var(--ease-luxury) infinite;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--ink);
            margin-bottom: 15px;
            font-size: clamp(38px, 5vw, 52px);
            animation: fadeInUp 0.82s var(--ease-luxury) 0.28s both;
        }

        p {
            color: #888;
            font-size: 16px;
            margin: 0 auto 15px;
            animation: fadeInUp 0.82s var(--ease-luxury) 0.34s both;
        }

        .order-id {
            background: #fff;
            padding: 15px 30px;
            border-radius: 10px;
            display: inline-block;
            margin: 20px 0;
            font-weight: 700;
            border: 2px dashed var(--gold);
            color: var(--ink);
            font-size: 24px;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.04);
            animation: fadeInUp 0.82s var(--ease-luxury) 0.5s both;
            transition: transform 0.45s var(--ease-luxury), box-shadow 0.45s var(--ease-luxury), border-color 0.45s var(--ease-luxury);
        }

        .order-id::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 45%;
            height: 200%;
            background: linear-gradient(120deg, transparent, rgba(212,175,55,0.70), transparent);
            transform: skewX(-30deg);
            transition: left 0.84s var(--ease-luxury);
        }

        .order-id:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 0 1px rgba(212,175,55,0.10), 0 12px 30px rgba(212,175,55,0.12);
            border-color: var(--gold-soft);
        }

        .order-id:hover::before {
            left: 140%;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), #c5a030);
            color: var(--ink);
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            position: relative;
            overflow: hidden;
            transition: transform 0.45s var(--ease-luxury), box-shadow 0.45s var(--ease-luxury), color 0.45s var(--ease-luxury), background 0.45s var(--ease-luxury);
        }

        .btn-gold::before,
        .btn-dark::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 45%;
            height: 200%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.84), transparent);
            transform: skewX(-30deg);
            transition: left 0.84s var(--ease-luxury);
        }

        .btn-gold:hover {
            transform: translateY(-3px);
            color: var(--ink);
            box-shadow: 0 10px 40px rgba(212,175,55,0.34), 0 0 20px rgba(212,175,55,0.24);
        }

        .btn-gold:hover::before,
        .btn-dark:hover::before {
            left: 130%;
        }

        .btn-dark {
            background: var(--deep);
            color: #fff;
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            position: relative;
            overflow: hidden;
            transition: transform 0.45s var(--ease-luxury), box-shadow 0.45s var(--ease-luxury), color 0.45s var(--ease-luxury), background 0.45s var(--ease-luxury);
        }

        .btn-dark:hover {
            transform: translateY(-3px);
            color: var(--gold-soft);
            background: var(--deep);
            box-shadow: 0 0 0 1px rgba(212,175,55,0.20), 0 12px 40px rgba(212,175,55,0.24);
        }

        .review-invite {
            max-width: 560px;
            margin: 45px auto 0;
            padding: 28px 24px;
            background: #fff;
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(212,175,55,0.08);
            animation: fadeInUp 0.82s var(--ease-luxury) 0.8s both;
            transition: transform 0.56s var(--ease-luxury), box-shadow 0.56s var(--ease-luxury), border-color 0.56s var(--ease-luxury);
        }

        .review-invite:hover {
            transform: translateY(-4px);
            border-color: rgba(212,175,55,0.56);
            box-shadow: 0 14px 48px rgba(212,175,55,0.14);
        }

        .review-invite h2 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 10px;
            color: var(--ink);
        }

        .review-invite p {
            color: #777;
            margin-bottom: 20px;
            animation: none;
        }

        @keyframes successPop {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            68% {
                opacity: 1;
                transform: scale(1.10);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                filter: blur(8px);
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            50% { opacity: 0.88; transform: translate(-50%, -50%) scale(1.06); }
        }

        @keyframes greenPulse {
            50% { opacity: 0.7; transform: scale(1.06); box-shadow: 0 0 0 8px rgba(40,167,69,0.06); }
        }

        @keyframes iconFloat {
            50% { transform: translateY(-2px); }
        }

        @media (max-width: 768px) {
            body { padding: 80px 20px; }
            .actions { flex-direction: column; }
            .actions a { width: min(280px, 100%); }
            .success-wrap { width: 100%; }
            .review-invite { max-width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
    <link rel="stylesheet" href="/responsive.css">
</head>
<body>
    <div class="success-wrap">
        <div class="success-icon"><i class="fas fa-check-circle"></i></div>
        <h1>Thank You! Your Order is Confirmed.</h1>
        <p style="color: #888;">A confirmation email has been sent. Please save your Order ID below:</p>
        
        <div class="order-id" id="orderIdDisplay">AE-XXXXXX</div>
        
        <div class="actions">
            <a href="./track-order.html" class="btn-gold"><i class="fas fa-truck me-2"></i>Track My Order</a>
            <a href="./shop.html" class="btn-dark">Continue Shopping</a>
        </div>

        <section class="review-invite" aria-labelledby="reviewInviteTitle">
            <h2 id="reviewInviteTitle">Share Your Experience</h2>
            <p>We would love to hear what you think about your Aura Emporium purchase.</p>
            <a href="./reviews.html" class="btn-gold"><i class="fas fa-star me-2"></i>Leave a Review</a>
        </section>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        if (orderId) {
            document.getElementById('orderIdDisplay').textContent = orderId;
        }
    </script>
</body>
</html>
