<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Manage Reviews | THE AURA EMPORIUM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/fontawesome/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/animations.css"><style>body{font-family:Inter,sans-serif;background:#f8f6f3;margin:0;padding:20px}.container{max-width:1000px;margin:0 auto;background:#fff;border-radius:20px;padding:30px;box-shadow:0 5px 30px rgba(0,0,0,.05)}h2{font-family:'Playfair Display',serif;color:#1a1a1a;margin-bottom:20px}h2 i{color:#d4af37;margin-right:10px}.review-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:15px 0}.review-content{flex:1}.review-content strong{font-size:16px}.review-content .stars{color:#d4af37;font-size:14px}.review-content p{color:#555;margin:5px 0}.review-content small{color:#999}.action-btns{display:flex;gap:10px}.btn-edit{background:#28a745;color:#fff;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-size:13px}.btn-delete{background:#dc3545;color:#fff;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-size:13px}.edit-form{background:#faf8f5;padding:20px;border-radius:10px;margin:10px 0;display:none}.edit-form input,.edit-form select,.edit-form textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px}.btn-save{background:#d4af37;color:#1a1a1a;padding:10px 20px;border:none;border-radius:8px;font-weight:600;cursor:pointer}.btn-cancel{background:#6c757d;color:#fff;padding:10px 20px;border:none;border-radius:8px;cursor:pointer}@media (max-width:480px){body,html{overflow-x:hidden!important}body{overflow-x:clip}canvas,img,picture,svg,video{max-width:100%;height:auto}.container,.container-fluid{padding-left:20px!important;padding-right:20px!important}.navbar-custom{padding:10px 0!important}.navbar-custom .container,.navbar-custom .container-fluid{display:flex;flex-wrap:nowrap!important;align-items:center;gap:8px}.navbar-custom .brand{flex:0 1 auto;min-width:0;font-size:20px!important;letter-spacing:1px!important;white-space:nowrap}.navbar-toggler{min-width:44px;min-height:44px;padding:8px;flex-shrink:0}.navbar-collapse{margin-top:10px}.navbar-custom .nav-link{min-height:44px;display:flex;align-items:center}.cart-icon,.nav-actions .cart-icon,.navbar-custom .nav-link.nav-icon{min-width:44px!important;min-height:44px!important;font-size:22px!important;flex-shrink:0}.cart-badge{width:20px;min-width:20px;height:20px;font-size:11px}.hero h1,.page-header h1,.page-hero h1,h1{font-size:clamp(1.75rem, 9vw, 2.5rem)!important;line-height:1.15}h2{font-size:clamp(1.4rem, 6.5vw, 2rem)}.hero,.page-header,.page-hero{padding-top:96px!important}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}body .cirvee-course-section .course-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}.col-explore{flex:0 0 50%!important;max-width:50%!important}.explore-card,.product-card,.review-card{min-width:0}.form-control,.form-select,form input:not([type=checkbox]):not([type=radio]),form select,form textarea{width:100%!important;min-height:48px}.btn,button,input[type=submit]{min-height:44px}.footer{padding:40px 0 24px!important}.footer .row{flex-direction:column}.footer .row>[class*=col-]{width:100%!important;max-width:100%!important}.row-2,.row-3{grid-template-columns:1fr!important}.table-responsive,.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.whatsapp-float{width:52px!important;height:52px!important;font-size:25px!important;bottom:18px!important;right:18px!important}.back-to-top{width:44px;height:44px;bottom:84px!important;right:18px!important}}@media (max-width:430px){.container,.container-fluid{padding-left:18px!important;padding-right:18px!important}.navbar-custom .brand{font-size:19px!important}.hero h1,.page-header h1,.page-hero h1,h1{font-size:clamp(1.65rem, 9.5vw, 2.25rem)!important}}@media (max-width:414px){.container,.container-fluid{padding-left:18px!important;padding-right:18px!important}.navbar-custom .brand{font-size:18px!important}.product-grid{gap:10px!important}}@media (max-width:390px){.container,.container-fluid{padding-left:16px!important;padding-right:16px!important}.navbar-custom .brand{font-size:18px!important;letter-spacing:.5px!important}.hero h1,.page-header h1,.page-hero h1,h1{font-size:clamp(1.55rem, 10vw, 2.1rem)!important}h2{font-size:clamp(1.3rem, 7vw, 1.8rem)}}@media (max-width:375px){.container,.container-fluid{padding-left:16px!important;padding-right:16px!important}.navbar-custom .brand{font-size:17px!important}.product-grid{gap:8px!important}.hero,.page-header,.page-hero{padding-top:88px!important}}@media (max-width:360px){.navbar-custom .brand{font-size:16px!important}.hero h1,.page-header h1,.page-hero h1,h1{font-size:clamp(1.45rem, 10.5vw, 1.9rem)!important}.product-grid{gap:8px!important}.footer{padding:32px 0 20px!important}}@media (max-width:320px){.container,.container-fluid{padding-left:16px!important;padding-right:16px!important}.navbar-custom{padding:8px 0!important}.navbar-custom .container,.navbar-custom .container-fluid{gap:6px}.navbar-custom .brand{font-size:15px!important;letter-spacing:.5px!important}.hero h1,.page-header h1,.page-hero h1,h1{font-size:1.5rem!important}h2{font-size:1.25rem}.product-grid{gap:8px!important}body .cirvee-course-section .course-grid{gap:10px!important}.hero-actions .btn,.hero-actions a{width:100%;margin-left:0!important}}</style><link rel="stylesheet" href="/responsive.css"><link rel="stylesheet" href="/toast.css"></head><body><div class="container"><h2><i class="fas fa-star"></i>Manage Reviews</h2><div id="reviewsList"></div></div><script>let allReviews=[];async function loadReviews(){try{const e=await fetch("/api/reviews");allReviews=await e.json(),renderReviews()}catch(e){console.error("Error loading reviews:",e),document.getElementById("reviewsList").innerHTML='<p class="text-center py-5" style="color: #dc3545;">Error loading reviews. Make sure server is running.</p>'}}function renderReviews(){const e=document.getElementById("reviewsList");0!==allReviews.length?e.innerHTML=allReviews.map((e,t)=>`\n            <div class="review-row">\n                <div class="review-content">\n                    <strong>${e.name}</strong>\n                    <div class="stars">${"★".repeat(parseInt(e.rating))}${"☆".repeat(5-parseInt(e.rating))}</div>\n                    <p>"${e.comment}"</p>\n                    <small>${new Date(e.date).toLocaleDateString()}</small>\n                </div>\n                <div class="action-btns">\n                    <button class="btn-edit" onclick="openEditForm(${t})"><i class="fas fa-edit"></i> Edit</button>\n                    <button class="btn-delete" onclick="deleteReview('${e._id}')"><i class="fas fa-trash"></i> Delete</button>\n                </div>\n            </div>\n            <div class="edit-form" id="editForm-${t}">\n                <input type="text" id="editName-${t}" value="${e.name}" placeholder="Name">\n                <select id="editRating-${t}">\n                    <option value="5" ${5==e.rating?"selected":""}>⭐⭐⭐⭐⭐</option>\n                    <option value="4" ${4==e.rating?"selected":""}>⭐⭐⭐⭐</option>\n                    <option value="3" ${3==e.rating?"selected":""}>⭐⭐⭐</option>\n                    <option value="2" ${2==e.rating?"selected":""}>⭐⭐</option>\n                    <option value="1" ${1==e.rating?"selected":""}>⭐</option>\n                </select>\n                <textarea id="editComment-${t}" rows="3">${e.comment}</textarea>\n                <button class="btn-save" onclick="saveEdit('${e._id}', ${t})"><i class="fas fa-check"></i> Save</button>\n                <button class="btn-cancel" onclick="closeEditForm(${t})">Cancel</button>\n            </div>\n        `).join(""):e.innerHTML='<p class="text-center py-5" style="color: #888;">No reviews yet.</p>'}function openEditForm(e){document.getElementById(`editForm-${e}`).style.display="block"}function closeEditForm(e){document.getElementById(`editForm-${e}`).style.display="none"}async function saveEdit(e,t){const n=document.getElementById(`editName-${t}`).value,i=document.getElementById(`editRating-${t}`).value,o=document.getElementById(`editComment-${t}`).value;try{const t=await fetch(`/api/reviews/${e}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,rating:i,comment:o})}),s=await t.json();s.success?(showToast("Review updated!","success"),loadReviews()):showToast("Error: "+s.error,"error")}catch(e){showToast("Network error. Please try again.","error")}}async function deleteReview(e){if(confirm("Are you sure you want to delete this review?"))try{const t=await fetch(`/api/reviews/${e}`,{method:"DELETE"});(await t.json()).success?(showToast("Review deleted!","success"),loadReviews()):showToast("Error deleting review.","error")}catch(e){showToast("Network error. Please try again.","error")}}loadReviews()</script><script src="/toast.js"></script></body></html>
