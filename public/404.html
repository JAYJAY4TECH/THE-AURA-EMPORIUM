<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/fontawesome/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/animations.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #faf8f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .error-container { text-align: center; }
        .error-container .number { font-size: 120px; font-weight: 700; color: #d4af37; font-family: 'Playfair Display', serif; }
        .error-container h1 { font-size: 32px; font-weight: 700; margin: 20px 0; font-family: 'Playfair Display', serif; }
        .error-container p { color: #666; margin-bottom: 30px; }
        .btn-gold {
            background: linear-gradient(135deg, #d4af37, #c5a030);
            color: #1a1a1a;
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            transition: all 0.4s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 40px rgba(212, 175, 55, 0.3); color: #1a1a1a; }
    </style>
    <link rel="stylesheet" href="/responsive.css">
</head>
<body>
<div class="error-container">
    <div class="number">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn-gold"><i class="fas fa-home me-2"></i>Go Home</a>
</div>
</body>
</html>
