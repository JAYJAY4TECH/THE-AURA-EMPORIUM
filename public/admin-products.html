lass="form-group"><label>Price (₦) *</label> <input type="number" id="price" step="0.01" min="0" required></div><div class="row-3"><div class="form-group"><label>Length</label> <input type="text" id="length"></div><div class="form-group"><label>Weight (gram)</label> <input type="text" id="weight"></div><div class="form-group"><label>Lace Type</label> <input type="text" id="laceType"></div></div><div class="form-group"><label>Product Image * (up to 5)</label><div class="upload-zone" id="uploadZone" onclick='document.getElementById("image").click()'><i class="fas fa-cloud-upload-alt"></i><p><strong>Click to upload</strong> or drag & drop images here</p><p class="hint">PNG, JPG, WEBP — max 5MB each</p><input type="file" id="image" accept="image/*" multiple="multiple" hidden></div><div class="preview-row" id="preview"></div></div><button type="submit" class="btn-gold" id="submitBtn"><i class="fas fa-plus"></i> Add Product</button></form><hr style="margin:40px 0 25px;border-color:#f0f0f0"><div class="list-toolbar"><h3><i class="fas fa-box me-2" style="color:var(--gold)"></i>Products in Store (<span id="productCount">0</span>)</h3><input type="text" class="search" id="searchList" oninput="renderList()"></div><div id="productList"><div class="empty-list"><i class="fas fa-spinner fa-spin"></i><p>Loading products…</p></div></div></div><div id="toast">✓ Product added</div><script>function escapeHtml(e=""){return String(e).replace(/[&<>"']/g,e=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[e]))}function formatPrice(e){const t=parseFloat(e);return isNaN(t)?"0":t.toLocaleString()}function toast(e,t="success"){const n=document.getElementById("toast");n.textContent=e,n.className="show "+t,clearTimeout(toast._t),toast._t=setTimeout(()=>n.className="",3e3)}const imgInput=document.getElementById("image"),preview=document.getElementById("preview"),uploadZone=document.getElementById("uploadZone");let selectedFiles=[];function handleFiles(e){Array.from(e).forEach(e=>{e.type.startsWith("image/")&&(selectedFiles.length>=5||selectedFiles.push(e))}),renderPreview()}function renderPreview(){preview.innerHTML=selectedFiles.map((e,t)=>`\n            <div class="preview-thumb">\n                <img src="${URL.createObjectURL(e)}" alt="preview">\n                <button type="button" onclick="removeFile(${t})">\n                    <i class="fas fa-times"></i>\n                </button>\n            </div>\n        `).join("")}function removeFile(e){selectedFiles.splice(e,1),renderPreview()}uploadZone.addEventListener("dragover",e=>{e.preventDefault(),uploadZone.classList.add("drag")}),uploadZone.addEventListener("dragleave",()=>uploadZone.classList.remove("drag")),uploadZone.addEventListener("drop",e=>{e.preventDefault(),uploadZone.classList.remove("drag"),handleFiles(e.dataTransfer.files)}),imgInput.addEventListener("change",()=>handleFiles(imgInput.files));let allProducts=[];async function loadProducts(){const e=document.getElementById("productList");e.innerHTML='\n        <div class="empty-list">\n            <i class="fas fa-spinner fa-spin"></i>\n            <p>Loading products…</p>\n        </div>';try{const e=await fetch("/api/admin/products");if(!e.ok)throw new Error("Server responded "+e.status);allProducts=await e.json(),document.getElementById("productCount").textContent=allProducts.length,renderList()}catch(t){console.error("Error loading products:",t),e.innerHTML='\n            <div class="empty-list">\n                <i class="fas fa-exclamation-triangle" style="color:#dc3545; opacity:1;"></i>\n                <p style="color:#dc3545;">Could not load products. Is the server running?</p>\n            </div>'}}function renderList(){const e=document.getElementById("productList"),t=document.getElementById("searchList").value.trim().toLowerCase(),n=t?allProducts.filter(e=>(e.name||"").toLowerCase().includes(t)):allProducts;0!==n.length?e.innerHTML=n.map(e=>`\n            <div class="product-item">\n                <img src="${e.
