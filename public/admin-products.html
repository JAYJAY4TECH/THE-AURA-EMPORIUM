    <style>
        :root {

            --dark: #1a1a1a;
            --muted: #888;

        body {

            color: #1a1a1a;
        }

        .admin-container {
            max-width: 700px;

            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.05);

        /* Top bar */
        .admin-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .admin-bar .brand {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
            text-decoration: none;
        }
        .admin-bar .brand .aura { color: var(--dark); font-weight: 300; }
        .admin-bar .actions { display: flex; gap: 10px; align-items: center; }

        .btn-outline {
            background: transparent;
            border: 1px solid #ddd;
            color: #555;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
            transition: all .2s;
        }
        .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
        .btn-outline.danger:hover { border-color: #dc3545; color: #dc3545; }

        h2 {
            font-family: 'Playfair Display', serif;
            color: var(--dark);
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            font-size: 24px;
        }
        h2 i { color: var(--gold); margin-right: 10px; }

        .form-group { margin-bottom: 18px; }

        label {
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: block;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #faf8f5;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            transition: all .2s;
        }
        input:focus, select:focus {
            border-color: var(--gold);
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) {
            .row-2, .row-3 { grid-template-columns: 1fr; }
        }

        /* Upload zone */
        .upload-zone {
            border: 2px dashed #ccc;
            background: #faf8f5;
            border-radius: 12px;
            padding: 22px;
            text-align: center;
            cursor: pointer;
            transition: all .3s;
        }
        .upload-zone:hover, .upload-zone.drag {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }
        .upload-zone i {
            font-size: 28px;
            color: var(--gold);
            display: block;
            margin-bottom: 8px;
        }
        .upload-zone p { color: var(--muted); font-size: 13px; margin: 0; }
        .upload-zone .hint { color: #bbb; font-size: 11px; margin-top: 5px; }

        .preview-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

            overflow: hidden;
            border: 1px solid #eee;
        }
        .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .preview-thumb button {
            position: absolute;

            height: 20px;

            color: #fff;

            cursor: pointer;
            font-size: 10px;

            align-items: center;

        .btn-gold {
            background: linear-gradient(135deg, #d4af37, #c5a030);
            color: #1a1a1a;

            border-radius: 50px;

        .btn-gold:hover {

        }
        .btn-gold:disabled { opacity: .5; cursor: not-allowed; transform: none; }

        
        .list-toolbar {

        #productList { display: flex; flex-direction: column; gap: 10px; }

        .product-item {

        .product-item:hover {

        }
        .product-item img {

            background: #faf8f5;

        }
        .product-details { flex: 1; min-width: 0; }
        .product-details strong {

        .btn-delete:hover { background: #dc3545; color: #fff; }

        
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;

            color: var(--gold);

        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        }

        .product-details strong {
            display: block;
            font-size: 14px;
            font-family: 'Playfair Display', serif;
            color: var(--dark);
            margin-bottom: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-details small {
            color: var(--muted);
            font-size: 12px;
            display: block;
        }

        .product-details .price {
            color: var(--gold);
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            font-size: 14px;
        }

        .product-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-delete {
            background: transparent;
            color: #dc3545;
            border: 1px solid #dc3545;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-delete:hover {
            background: #dc3545;
            color: #fff;
            transform: translateY(-1px);
        }

        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--dark);
            color: var(--gold);
            padding: 14px 24px;
            border-radius: 10px;
            border-left: 4px solid var(--gold);
            box-shadow: 0 15px 40px rgba(0,0,0,.25);
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 9999;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            box-shadow: 0 14px 44px rgba(212,175,55,0.20), 0 0 20px rgba(212,175,55,0.22);
        }

        #toast.success {
            border-left-color: #4caf50;
            color: #4caf50;
        }

        #toast.error {
            border-left-color: #dc3545;
            color: #ff6b7a;
        }

        .empty-list {
            text-align: center;
            padding: 50px 20px;
            color: var(--muted);
            animation: fadeInUp 0.34s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .empty-list i {
            font-size: 40px;
            color: var(--gold);
            opacity: .4;
            display: block;
            margin-bottom: 12px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                filter: blur(8px);
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }
        }

        @keyframes itemFade {
            from {
                opacity: 0;
                transform: translateY(12px);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes thumbIn {
            from {
                opacity: 0;
                transform: scale(0.96);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes iconPulseGlow {
            50% {
                filter: drop-shadow(0 0 16px rgba(212,175,55,0.95));
                transform: scale(1.08);
            }
        }

        @keyframes crownShimmer {
            50% {
                filter: drop-shadow(0 0 12px rgba(212,175,55,0.8));
                color: var(--gold);
                transform: scale(1.06);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 14px;
            }

            .admin-container {
                max-width: 100%;
                padding: 22px 16px;
                border-radius: 16px;
            }

            .admin-bar {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .admin-bar .actions {
                width: 100%;
                justify-content: flex-start;
            }

            .list-toolbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .list-toolbar .search {
                width: 100%;
            }

            .product-item {
                align-items: flex-start;
                flex-wrap: wrap;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>

<div class="admin-container">

    
    <div class="admin-bar">
        <a href="/shop.html" class="brand">
            <i class="fas fa-crown"></i> THE <span class="aura">AURA</span> EMPORIUM
        </a>
        <div class="actions">
            <a href="/shop.html" target="_blank" class="btn-outline">
                <i class="fas fa-external-link-alt me-1"></i> View Shop
            </a>
        </div>
    </div>

    <h2><i class="fas fa-crown"></i>Add New Product</h2>

    
    <form id="productForm" enctype="multipart/form-data" onsubmit="event.preventDefault(); addProduct();">

        <div class="form-group">
            <label>Product Name *</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label>Price (₦) *</label>
            <input type="number" id="price" step="0.01" min="0" required>
        </div>

        <div class="row-3">
            <div class="form-group">
                <label>Length</label>
                <input type="text" id="length">
            </div>
            <div class="form-group">
                <label>Weight (gram)</label>
                <input type="text" id="weight">
            </div>
            <div class="form-group">
                <label>Lace Type</label>
                <input type="text" id="laceType">
            </div>
        </div>

        <div class="form-group">
            <label>Product Image * (up to 5)</label>
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('image').click()">
                <i class="fas fa-cloud-upload-alt"></i>
                <p><strong>Click to upload</strong> or drag & drop images here</p>
                <p class="hint">PNG, JPG, WEBP — max 5MB each</p>
                <input type="file" id="image" accept="image/*" multiple hidden>
            </div>
            <div class="preview-row" id="preview"></div>
        </div>

        <button type="submit" class="btn-gold" id="submitBtn">
            <i class="fas fa-plus"></i> Add Product
        </button>
    </form>

    <hr style="margin: 40px 0 25px; border-color: #f0f0f0;">

    
    <div class="list-toolbar">
        <h3><i class="fas fa-box me-2" style="color:var(--gold);"></i>Products in Store (<span id="productCount">0</span>)</h3>
        <input type="text" class="search" id="searchList" oninput="renderList()">
    </div>

    <div id="productList">
        <div class="empty-list">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading products…</p>
        </div>
    </div>
</div>

<div id="toast">✓ Product added</div>

<script>

function escapeHtml(s = '') {
    return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
}

function formatPrice(p) {
    const n = parseFloat(p);
    return isNaN(n) ? '0' : n.toLocaleString();
}

function toast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + type;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.className = '', 3000);
}

const imgInput = document.getElementById('image');
const preview = document.getElementById('preview');
const uploadZone = document.getElementById('uploadZone');
let selectedFiles = [];

uploadZone.addEventListener('dragover', e => {
    e.preventDefault();
    uploadZone.classList.add('drag');
});
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
});
imgInput.addEventListener('change', () => handleFiles(imgInput.files));

function handleFiles(files) {
    Array.from(files).forEach(f => {
        if (!f.type.startsWith('image/')) return;
        if (selectedFiles.length >= 5) return;
        selectedFiles.push(f);
    });
    renderPreview();
}

function renderPreview() {
    preview.innerHTML = selectedFiles.map((f, i) => {
        const url = URL.createObjectURL(f);
        return `
            <div class="preview-thumb">
                <img src="${url}" alt="preview">
                <button type="button" onclick="removeFile(${i})">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        `;
    }).join('');
}

function removeFile(i) {
    selectedFiles.splice(i, 1);
    renderPreview();
}


let allProducts = [];

async function loadProducts() {
    const list = document.getElementById('productList');
    list.innerHTML = `
        <div class="empty-list">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading products…</p>
        </div>`;

    try {
        const res = await fetch('/api/admin/products');
        if (!res.ok) throw new Error('Server responded ' + res.status);

        allProducts = await res.json();
        document.getElementById('productCount').textContent = allProducts.length;
        renderList();
    } catch (error) {
        console.error('Error loading products:', error);
        list.innerHTML = `
            <div class="empty-list">
                <i class="fas fa-exclamation-triangle" style="color:#dc3545; opacity:1;"></i>
                <p style="color:#dc3545;">Could not load products. Is the server running?</p>
            </div>`;
    }
}

function renderList() {
    const list = document.getElementById('productList');
    const q = document.getElementById('searchList').value.trim().toLowerCase();

    const filtered = q
        ? allProducts.filter(p => (p.name || '').toLowerCase().includes(q))
        : allProducts;

    if (filtered.length === 0) {
        list.innerHTML = `
            <div class="empty-list">
                <i class="fas fa-box-open"></i>
                <p>${allProducts.length === 0 ? 'No products yet. Add your first one above.' : 'No products match your search.'}</p>
            </div>`;
        return;
    }

    list.innerHTML = filtered.map(product => {
        const img = (product.images && product.images.length > 0)
            ? product.images[0]
            : 'https://via.placeholder.com/60/faf8f5/d4af37?text=+';

        return `
            <div class="product-item">
                <img src="${img}" alt="${escapeHtml(product.name)}"
                     onerror="this.src='https://via.placeholder.com/60/faf8f5/d4af37?text=+'">
                <div class="product-details">
                    <strong>${escapeHtml(product.name)}</strong>
                    <small>
                        <span class="price">₦${formatPrice(product.price)}</span>
                        ${product.length ? ` · ${escapeHtml(product.length)}` : ''}
                        ${product.weight ? ` · ${escapeHtml(product.weight)}` : ''}
                        ${product.laceType ? ` · ${escapeHtml(product.laceType)}` : ''}
                    </small>
                </div>
                <div class="product-actions">
                    <button class="btn-delete" onclick="deleteProduct('${product._id}', '${escapeHtml(product.name)}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        `;
    }).join('');
}


async function addProduct() {
    const name = document.getElementById('name').value.trim();
    const price = document.getElementById('price').value;
    const length = document.getElementById('length').value.trim();
    const weight = document.getElementById('weight').value.trim();
    const laceType = document.getElementById('laceType').value.trim();

    
    if (!name || !price) {
        toast('❌ Name and price are required', 'error');
        return;
    }
    if (selectedFiles.length === 0) {
        toast('❌ Please upload at least one image', 'error');
        return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading…';

    const fd = new FormData();
    fd.append('name', name);
    fd.append('price', price);
    fd.append('length', length);
    fd.append('weight', weight);
    fd.append('laceType', laceType);
    selectedFiles.forEach(f => fd.append('images', f));

    try {
        const res = await fetch('/api/admin/products', { method: 'POST', body: fd });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Upload failed');

        toast('✓ Product added successfully');
        resetForm();
        loadProducts();
    } catch (error) {
        toast('❌ ' + error.message, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-plus"></i> Add Product';
    }
}

function resetForm() {
    document.getElementById('productForm').reset();
    selectedFiles = [];
    renderPreview();
}


async function deleteProduct(id, name) {
    if (!confirm(`Delete "${name}"?\n\nThis cannot be undone.`)) return;

    try {
        const res = await fetch('/api/admin/products/' + id, { method: 'DELETE' });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Delete failed');

        toast('✓ Product deleted');
        loadProducts();
    } catch (error) {
        toast('❌ ' + error.message, 'error');
    }
}

 
window.addEventListener('load', loadProducts);
</script>

</body>
</html>
